<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng css vào trang html thông qua phần tử style</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: green;
            padding: 20px;
        }
        header{
            text-align: center;
            margin-top: 3rem;
        }
        h1{
            color: yellow;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="main-title">Nhúng css vào trang html thông qua phần tử style</h1>
    </header>
</body>
</html>
