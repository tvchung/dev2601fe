<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màu theo hệ thập lục phân - HEX</title>
    <style>
        .box {
            margin: 2rem;
            color: #ff0000; /* #f00 */
            background-color: #00ff00;
            width: 180px;
            height: auto;
            padding: 1rem;
            text-align: center;
            vertical-align: middle;
            border: 3px solid #0000ff;
            border-radius: 5px;
        }
        .box-1 {
            margin: 2rem;
            color: rgb(255, 200, 100);
            background-color: rgb(128, 123, 123);
            width: 180px;
            height: auto;
            padding: 1rem;
            text-align: center;
            vertical-align: middle;
            border: 5px solid rgb(255, 0, 255);
            border-radius: 5px;
        }
        .box-2 {
            margin: 2rem;
            color: red;
            background-color: green;
            width: 180px;
            height: auto;
            padding: 1rem;
            text-align: center;
            vertical-align: middle;
            border: 5px solid blue;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Màu theo hệ thập lục phân - HEX</h1>
    </div>

    <div class="box-1">
        <h1>Màu theo kết hợp màu RGB</h1>
    </div>

    <div class="box-2">
        <h1>Màu theo tên tiếng anh</h1>
    </div>
</body>
</html>
