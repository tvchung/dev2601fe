<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Table - Form</title>
</head>
<body>
    <h1>Review Table - Form</h1>
    <hr/>
    <table border="1px" cellspacing="0" cellpadding="5px" width="80%" align="center">
        <thead>
            <tr>
                <th rowspan="2">STT</th>
                <th rowspan="2">Họ và tên</th>
                <th colspan="3">Điểm</th>
            </tr>
            <tr>
                <th>Toán</th>
                <th>Lý</th>
                <th>Hóa</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">1</td>
                <td>Nguyễn Văn A</td>
                <td align="right">8.5</td>
                <td align="right">7.0</td>
                <td align="right">9.5</td>
            </tr>
            <tr>
                <td align="center">2</td>
                <td>Trần Thị B</td>
                <td align="right">9.0</td>
                <td align="right">8.5</td>
                <td align="right">8.0</td>
            </tr>
            <tr>
                <td align="center">3</td>
                <td>Phạm Văn C</td>
                <td align="right">7.5</td>
                <td align="right">9.0</td>
                <td align="right">8.5</td>
            </tr>
            <tr>
                <td align="center">4</td>
                <td>Đỗ Thị D</td>
                <td align="right">8.0</td>
                <td align="right">8.0</td>
                <td align="right">9.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Trung bình:</th>
                <th align="right">8.25</th>
                <th align="right">8.0</th>
                <th align="right">8.75</th>
            </tr>
        </tfoot>
    </table>
    <hr>
    <h2>Form đăng ký</h2>
    <form action="" method="post">
        <table>
            <tbody>
                <tr>
                    <th><label for="hoVaTen">Họ và tên:</label></th>
                    <td><input type="text" id="hoVaTen" name="hoVaTen"></td>
                </tr>
                <tr>
                    <th><label for="email">Email:</label></th>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <th><label for="matKhau">Mật khẩu:</label></th>
                    <td><input type="password" id="matKhau" name="matKhau"></td>
                </tr>
                <tr>
                    <th><label for="ghiChu">Ghi chú:</label></th>
                    <td><textarea id="ghiChu" name="ghiChu" rows="4" cols="30"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Đăng ký">
                        <input type="reset" value="Nhập lại">
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
