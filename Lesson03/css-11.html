<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout cơ bản- display</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            width: 300px;
            padding: 1em;
            border: 4px solid #3498db;
            margin: 30px auto;
            box-sizing: border-box;
            background: #ecf0f1;
        }
        p{
            display:  inline-block;
        }
        ul,li{
            list-style: none;
          
        }
      
        nav{
            background-color: green;
        }
        nav ul{
            display: flex;
            justify-content: center;
            gap: 2rem;
            background-color: violet;
        }

        li{
            background-color: orange;
        }
        nav ul li a{
            color: red;
            text-decoration: none;
            font-size: 1.2rem;
            background-color: yellow;
            display: block;
            padding: .5rem 1rem;
    </style>
</head>
<body>
    <h1>Layout cơ bản- display</h1>
    <hr>
    <div class="box">
        <p>Thuộc tính display có tác dụng xác định cách hiển thị của phần tử trên trang web. Một số giá trị phổ biến của thuộc tính display bao gồm: block / inline / inline-block / none  </p>
    </div>

    <nav>
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>
</body>
</html>
