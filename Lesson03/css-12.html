<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        div{
            position: relative;
            width: 300px;
            height: 200px;
            border: 3px solid red ;
            box-sizing: border-box ;
            padding: 1rem;
            background-color: yellow;
            background-image: url('https://devmaster.edu.vn/uploads/images/devmaster-campaign/devmaster-lap-trinh-vien-website-php-va-mysql-chuyen-nghiep.png');
        }
        span{
            position: absolute;
            width: 50px;
            height: 50px;
            top: 0;
            right: 0;
            color: red;
            background: blue;
            border-bottom-left-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Position</h1>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit </p>
        <span>50%</span>
    </div>
</body>
</html>
