<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn vị thường dùng trong css</title>
    <style>
        h1 {
            font-size: 3rem;
        }   
        .card {
            width: 50%;
            height: auto;
            background-color: blue;
            margin: 3rem auto;
            border: 10px solid red;
            color: white;
            padding: 1rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <h1>Đơn vị thường dùng trong css: %, px, em, rem, vw/vh</h1>
    <hr>
    <div class="card">
        Nội dung của thẻ div có class là card, có chiều rộng bằng 50% chiều rộng của phần tử cha, chiều cao là 200px, có nền màu xanh và viền màu đỏ dày 10px. Thẻ div này được căn giữa theo chiều ngang với margin: 2rem auto.
    </div>
</body>
</html>
