<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chúc mừng ngày Quốc tế Phụ nữ 8/3</title>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top, #ffe3ec, #ffc8dd, #ffafcc);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-hearts span {
            position: absolute;
            font-size: 20px;
            opacity: 0.18;
            animation: floatUp linear infinite;
            user-select: none;
        }
        .title h1{
            font-family: "Allura", cursive;
            font-size: 20rem;
            color: #e91e63;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(255,255,255,0.8);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }

            20% {
                opacity: 0.18;
            }

            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #b30059;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            z-index: 2;
        }

        .title h1 {
            font-size: clamp(36px, 5vw, 72px);
            margin-bottom: 10px;
        }
        .heart-wrapper {
            position: relative;
            width: min(90vw, 700px);
            height: min(70vw, 620px);
            min-height: 420px;
        }

        .flower {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: clamp(18px, 2.2vw, 32px);
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.18));
            animation: bloom 2.5s ease-in-out infinite;
            user-select: none;
            cursor: default;
        }

        .flower:nth-child(odd) {
            animation-duration: 2.8s;
        }

        .flower:nth-child(3n) {
            animation-duration: 3.2s;
        }

        @keyframes bloom {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.18);
            }
        }

        .message-box {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 16px 22px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(179, 0, 89, 0.12);
            z-index: 2;
            max-width: 700px;
        }

        .message-box h2 {
            color: #c2185b;
            font-size: clamp(20px, 2.6vw, 34px);
            margin-bottom: 8px;
        }

        .message-box p {
            color: #7a1b47;
            font-size: clamp(14px, 1.5vw, 19px);
            line-height: 1.6;
            font-weight: 500;
        }

        .signature {
            margin-top: 10px;
            color: #a00050;
            font-style: italic;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .heart-wrapper {
                height: 420px;
            }

            .message-box {
                margin-top: 8px;
                padding: 14px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-hearts" id="bgHearts"></div>
    <div class="container">
        <div class="title">
            <h1>🌷 Chúc mừng Ngày Quốc tế Phụ nữ 8/3 🌷</h1>
        </div>

        <div class="heart-wrapper" id="heart"></div>

        <div class="message-box">
            <h2>Happy Women's Day 8/3 💖</h2>
            <p>
                Kính chúc một nửa thế giới luôn xinh đẹp, hạnh phúc, mạnh khỏe và thành công.
                Mong rằng mỗi ngày đều ngập tràn niềm vui, yêu thương và những điều tốt đẹp nhất.
            </p>
            <div class="signature">🌸 Trân trọng gửi tặng 99 đóa hoa yêu thương 🌸</div>
        </div>
    </div>

    <script>
        const heart = document.getElementById("heart");
        const totalFlowers = 99;

        // Tạo 99 bông hoa xếp theo phương trình trái tim
        for (let i = 0; i < totalFlowers; i++) {
            const t = (Math.PI * 2 * i) / totalFlowers;

            // Phương trình trái tim parametric
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y =
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t);

            const flower = document.createElement("div");
            flower.className = "flower";
            flower.textContent = "🌷";

            // scale và căn giữa
            const scale = 16;
            const posX = 50 + x * scale / 10;
            const posY = 48 - y * scale / 10;

            flower.style.left = posX + "%";
            flower.style.top = posY + "%";

            // tạo độ trễ animation ngẫu nhiên
            flower.style.animationDelay = (Math.random() * 2) + "s";

            heart.appendChild(flower);
        }

        // Tạo nền tim bay
        const bgHearts = document.getElementById("bgHearts");
        const symbols = ["💖", "💕", "🌸", "💗","💖", "💕", "🌸", "💗"];

        for (let i = 0; i < 24; i++) {
            const item = document.createElement("span");
            item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            item.style.left = Math.random() * 100 + "vw";
            item.style.animationDuration = (6 + Math.random() * 8) + "s";
            item.style.animationDelay = Math.random() * 6 + "s";
            item.style.fontSize = (16 + Math.random() * 20) + "px";
            bgHearts.appendChild(item);
        }
    </script>
</body>

</html>
