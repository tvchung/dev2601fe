<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lệnh rẽ nhánh if</title>
</head>
<body>
    <h1>Lệnh rẽ nhánh if</h1>

    <script>
        let age = parseInt(prompt("Nhập vào tuổi của bạn:"));

        if(age>=18){
            document.writeln("<p> Bạn đủ tuổi bầu cử")
        }else{
            document.writeln("<p> Bạn chưa đủ tuổi bầu cử")
        }

    </script>
</body>
</html>
