<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hàm alert; confirm; prompt</title>
</head>
<body>
    <h1>Sử dụng các hàm alert(); confirm(); prompt()</h1>
    <script>
        debugger; // chạy từng bước (dòng lệnh)
        console.log("Welcome to, .....");

        var name = prompt("Nhập tên của bạn:");

        alert("Welcome to, \t"+ name);
        console.log("Welcome to, \t"+ name);
        
        let check = confirm("Bạn có muốn xóa không?");
        console.log("Check: " , check);
        
    </script>
</body>
</html>
