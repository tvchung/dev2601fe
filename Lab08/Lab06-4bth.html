<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán tử trong JavaScript</title>
</head>
<body>
    <h1>Toán tử trong JavaScript</h1>
    <hr>
    <script>
        let a = parseFloat(prompt("Nhập số a="));
        let b = parseFloat(prompt("Nhập số b="));

        document.write("<p> " + a + "+" + b + "=" + (a+b));
        document.write("<p> " + a + "-" + b + "=" + (a-b));
        document.write("<p> " + a + "*" + b + "=" + (a*b));
        document.write("<p> " + a + "/" + b + "=" + (a/b));
        document.write("<p> " + a + "%" + b + "=" + (a%b));
        
    </script>
</body>
</html>
